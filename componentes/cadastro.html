<!-- CONTEÚDO -->
<main>
<section class="form-secao">
<div class="form-cartao">
<form id="formCadastro">
<div class="campo">
<label for="nome">Nome completo</label>
<input type="text" id="nome" name="nome" placeholder="Digite seu

nome" required>
</div>
<div class="campo">
<label for="email">E-mail</label>
<input type="email" id="email" name="email"

placeholder="seuemail@exemplo.com" required>

</div>
<div class="campo">
<label for="senha">Senha</label>
<input type="password" id="senha" name="senha" placeholder="Crie uma

senha" required minlength="6">
</div>
<div class="campo">
<label for="confirmarSenha">Confirmar senha</label>
<input type="password" id="confirmarSenha" name="confirmarSenha"

placeholder="Repita a senha" required minlength="6">

</div>
<div class="campo campo-checkbox">
<input type="checkbox" id="termos" name="termos" required>
<label for="termos" style="margin-bottom: 0;">Eu concordo com os

termos de uso</label>
</div>
<button type="submit" class="botao-enviar">Criar conta</button>
<div class="form-sucesso" id="cadastroSucesso">
✅ Cadastro realizado com sucesso! Bem-vindo(a).
</div>
</form>
</div>
</section>
</main>
